[workspace]
members = ["first-app"]
resolver = "3"

[workspace.dependencies]
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
winit = "0.30"
wgpu = "23"
console_error_panic_hook = "0.1.7"
console_log = "1.0"
wasm-bindgen = "0.2.97"
wasm-bindgen-futures = "0.4.47"
web-sys = { version = "0.3.77", features = [
    "Document",
    "Window",
    "Location",
    "Element",
    "HtmlCanvasElement",
] }
cfg-if = "1"
pollster = "0.4"
fern = "0.7"
